<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<title>Distância de Golfe (nome pendente)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--verde:#1b5e20;--verde2:#2e7d32;--fundo:#fafafa;--txt:#1c1c1c;--aviso:#b26a00}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--fundo)}
  #app{display:flex;flex-direction:column;height:100%}
  #telas{flex:1;position:relative;min-height:0}
  .tela{position:absolute;inset:0;display:none;overflow:auto;background:var(--fundo)}
  .tela.ativa{display:block}
  #tela-mapa{display:none;flex-direction:column}
  #tela-mapa.ativa{display:flex}
  #map{flex:1;min-height:0}
  #painel{background:#fff;border-top:1px solid #ddd;padding:8px 10px;max-height:46%;overflow:auto}
  nav{display:flex;border-top:1px solid #ccc;background:#fff;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:12px 4px;border:0;background:none;font-size:14px;color:#555}
  nav button.ativa{color:var(--verde);font-weight:700;border-top:3px solid var(--verde)}
  .linha{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
  .chip,.btn{border:1px solid var(--verde2);background:#fff;color:var(--verde);border-radius:18px;padding:8px 12px;font-size:14px}
  .chip.sel{background:var(--verde2);color:#fff}
  .btn.cheio{background:var(--verde2);color:#fff;border-radius:8px;padding:11px 14px;font-weight:600}
  .btn.perigo{border-color:#b71c1c;color:#b71c1c}
  .btn:disabled{opacity:.5}
  .grande{font-size:30px;font-weight:700;color:var(--verde)}
  .pequeno{font-size:12px;color:#666}
  .aviso{color:var(--aviso);font-size:13px}
  .sec{padding:14px;max-width:720px;margin:0 auto}
  h2{margin:.2em 0 .5em;font-size:20px} h3{margin:1em 0 .3em;font-size:16px}
  select,textarea,input{font-size:16px;padding:8px;border:1px solid #bbb;border-radius:6px;width:100%}
  table{border-collapse:collapse;width:100%;font-size:14px}
  td,th{border-bottom:1px solid #e3e3e3;padding:6px 4px;text-align:left}
  .pre{white-space:pre-wrap;font-size:14px;line-height:1.45}
  .bandeira{font-size:22px;line-height:22px;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="telas">
    <!-- MAPA -->
    <section id="tela-mapa" class="tela ativa">
      <div id="map"></div>
      <div id="painel">
        <div class="linha">
          <button class="chip sel" id="modo-alvo">Alvo</button>
          <button class="chip" id="modo-tacada">Tacada</button>
          <span class="pequeno" id="status-gps">Aguardando GPS…</span>
        </div>
        <!-- Modo alvo -->
        <div id="p-alvo">
          <div class="linha">
            <span class="pequeno">Toque no mapa para marcar:</span>
            <button class="chip" data-pt="frente">Frente</button>
            <button class="chip sel" data-pt="centro">Centro</button>
            <button class="chip" data-pt="fundo">Fundo</button>
            <button class="chip" id="limpar-alvo">Limpar</button>
          </div>
          <div id="dist-alvo" class="pequeno">Nenhum alvo marcado.</div>
        </div>
        <!-- Modo tacada -->
        <div id="p-tacada" style="display:none">
          <div class="linha">
            <button class="btn cheio" id="btn-saida">Marcar saída (bola aqui)</button>
            <button class="btn cheio" id="btn-chegada" disabled>Marcar chegada</button>
          </div>
          <div id="res-tacada" class="pequeno">Fique ao lado da bola e toque em “Marcar saída”. Dê a tacada, caminhe até a bola e toque em “Marcar chegada”.</div>
          <div id="salvar-tacada" style="display:none">
            <div class="linha"><select id="sel-taco"></select></div>
            <div class="linha">
              <button class="btn cheio" id="btn-salvar">Salvar tacada</button>
              <button class="btn perigo" id="btn-descartar">Descartar</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- HISTÓRICO -->
    <section id="tela-hist" class="tela"><div class="sec">
      <h2>Histórico de tacadas</h2>
      <div id="hist-medias"></div>
      <h3>Tacadas</h3>
      <div id="hist-lista"></div>
      <p><button class="btn perigo" id="limpar-hist">Apagar histórico</button></p>
    </div></section>

    <!-- AJUSTES -->
    <section id="tela-ajustes" class="tela"><div class="sec">
      <h2>Ajustes</h2>
      <h3>Unidade de distância</h3>
      <select id="cfg-unidade"><option value="yd">Jardas (padrão)</option><option value="m">Metros</option></select>
      <h3>Tacos (separados por vírgula)</h3>
      <textarea id="cfg-tacos" rows="4"></textarea>
      <p><button class="btn cheio" id="cfg-salvar">Salvar ajustes</button></p>
      <p class="pequeno" id="cfg-msg"></p>
    </div></section>

    <!-- SOBRE -->
    <section id="tela-sobre" class="tela"><div class="sec pre" id="sobre"></div></section>
  </div>
  <nav>
    <button data-tela="tela-mapa" class="ativa">Mapa</button>
    <button data-tela="tela-hist">Histórico</button>
    <button data-tela="tela-ajustes">Ajustes</button>
    <button data-tela="tela-sobre">Sobre</button>
  </nav>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
'use strict';
var VERSAO = '0.1.0 (protótipo)';
var NOME_APP = 'Nome do app: PENDENTE';
var COPYRIGHT = '© 2026 Felippe Alvarez';
var LIMITE_AVISO_M = 10;      // aviso se precisão pior que isso
var TEMPO_MEDIA_MS = 8000;    // tempo de média por marcação

// ---------- armazenamento (com try/catch) ----------
function ler(k, padrao){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; }catch(e){ return padrao; } }
function gravar(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

var cfg = ler('cfg', {unidade:'yd', tacos:['Driver','Madeira 3','Híbrido','Ferro 4','Ferro 5','Ferro 6','Ferro 7','Ferro 8','Ferro 9','Pitching','Sand','Lob','Putter']});
var hist = ler('hist', []);

// ---------- distância (elipsoide WGS84, aproximação local; erro de mm até alguns km) ----------
function dist(a,b){
  var rad = Math.PI/180, lat = (a.lat+b.lat)/2*rad;
  var A = 6378137, e2 = 0.00669437999014, s = Math.sin(lat), w = Math.sqrt(1 - e2*s*s);
  var mLat = A*(1-e2)/(w*w*w), mLon = A*Math.cos(lat)/w;
  var dy = (b.lat-a.lat)*rad*mLat, dx = (b.lng-a.lng)*rad*mLon;
  return Math.hypot(dx,dy);
}
function fmt(m){
  if(cfg.unidade==='yd') return Math.round(m/0.9144) + ' jd';
  return Math.round(m) + ' m';
}
function fmtPrec(m){
  if(cfg.unidade==='yd') return '±' + Math.round(m/0.9144) + ' jd';
  return '±' + Math.round(m) + ' m';
}

// ---------- mapa ----------
var map = L.map('map', {zoomControl:true, maxZoom:19}).setView([-22.99,-43.36], 16);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19,
  attribution:'Imagens: Esri, Maxar, Earthstar Geographics e comunidade GIS | Mapa: Leaflet'
}).addTo(map);

var pos = null, marcaPos = null, circPos = null, primeiroFix = true;

function onPos(p){
  pos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, t:p.timestamp};
  if(!marcaPos){
    marcaPos = L.circleMarker([pos.lat,pos.lng], {radius:7, color:'#fff', weight:2, fillColor:'#1976d2', fillOpacity:1}).addTo(map);
    circPos = L.circle([pos.lat,pos.lng], {radius:pos.acc, color:'#1976d2', weight:1, fillOpacity:.12}).addTo(map);
  } else {
    marcaPos.setLatLng([pos.lat,pos.lng]); circPos.setLatLng([pos.lat,pos.lng]); circPos.setRadius(pos.acc);
  }
  if(primeiroFix){ map.setView([pos.lat,pos.lng], 18); primeiroFix = false; }
  var st = document.getElementById('status-gps');
  st.textContent = 'GPS ' + fmtPrec(pos.acc);
  st.className = pos.acc > LIMITE_AVISO_M ? 'aviso' : 'pequeno';
  if(pos.acc > LIMITE_AVISO_M) st.textContent += ' — precisão baixa';
  atualizaAlvo();
  amostrar(pos);
}
function onErro(e){
  var msg = {1:'Permissão de localização negada.',2:'Posição indisponível.',3:'Tempo esgotado para obter GPS.'}[e.code] || 'Erro de GPS.';
  var st = document.getElementById('status-gps'); st.textContent = msg; st.className = 'aviso';
}
if('geolocation' in navigator){
  navigator.geolocation.watchPosition(onPos, onErro, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
} else {
  document.getElementById('status-gps').textContent = 'Este aparelho/navegador não oferece geolocalização.';
}

// ---------- modo alvo ----------
var alvos = {frente:null, centro:null, fundo:null}, marcasAlvo = {}, tipoAlvo = 'centro';
var rotulo = {frente:'Frente', centro:'Centro', fundo:'Fundo'};
document.querySelectorAll('#p-alvo [data-pt]').forEach(function(b){
  b.addEventListener('click', function(){
    tipoAlvo = b.dataset.pt;
    document.querySelectorAll('#p-alvo [data-pt]').forEach(function(x){ x.classList.toggle('sel', x===b); });
  });
});
map.on('click', function(ev){
  if(modo!=='alvo') return;
  alvos[tipoAlvo] = {lat:ev.latlng.lat, lng:ev.latlng.lng};
  if(marcasAlvo[tipoAlvo]) marcasAlvo[tipoAlvo].setLatLng(ev.latlng);
  else marcasAlvo[tipoAlvo] = L.marker(ev.latlng, {icon:L.divIcon({className:'', html:'<div class="bandeira">'+(tipoAlvo==='centro'?'🚩':'📍')+'</div>', iconSize:[24,24], iconAnchor:[12,22]})}).addTo(map);
  atualizaAlvo();
});
document.getElementById('limpar-alvo').addEventListener('click', function(){
  Object.keys(marcasAlvo).forEach(function(k){ map.removeLayer(marcasAlvo[k]); });
  marcasAlvo = {}; alvos = {frente:null, centro:null, fundo:null}; atualizaAlvo();
});
function atualizaAlvo(){
  var el = document.getElementById('dist-alvo');
  var partes = [];
  ['frente','centro','fundo'].forEach(function(k){
    if(alvos[k]){
      partes.push(pos ? '<span class="grande">'+fmt(dist(pos,alvos[k]))+'</span> <span class="pequeno">'+rotulo[k]+'</span>' : rotulo[k]+': aguardando GPS');
    }
  });
  if(!partes.length){ el.textContent = 'Nenhum alvo marcado.'; return; }
  el.innerHTML = partes.join(' &nbsp; ') + (pos ? '<div class="pequeno">Sua posição '+fmtPrec(pos.acc)+'. Distância em linha reta, sem desnível nem vento.</div>' : '');
}

// ---------- modo tacada ----------
var modo = 'alvo';
function setModo(m){
  modo = m;
  document.getElementById('modo-alvo').classList.toggle('sel', m==='alvo');
  document.getElementById('modo-tacada').classList.toggle('sel', m==='tacada');
  document.getElementById('p-alvo').style.display = m==='alvo' ? '' : 'none';
  document.getElementById('p-tacada').style.display = m==='tacada' ? '' : 'none';
  setTimeout(function(){ map.invalidateSize(); }, 50);
}
document.getElementById('modo-alvo').addEventListener('click', function(){ setModo('alvo'); });
document.getElementById('modo-tacada').addEventListener('click', function(){ setModo('tacada'); });

var amostras = null, amostrando = null, saida = null, chegada = null, linhaTacada = null, marcasT = [];
function amostrar(p){ if(amostras) amostras.push({lat:p.lat, lng:p.lng, acc:p.acc}); }
function mediaPonderada(a){
  var sw=0, slat=0, slng=0;
  a.forEach(function(s){ var w = 1/Math.max(s.acc,1)/Math.max(s.acc,1); sw+=w; slat+=w*s.lat; slng+=w*s.lng; });
  var accs = a.map(function(s){ return s.acc; }).sort(function(x,y){ return x-y; });
  return {lat:slat/sw, lng:slng/sw, acc:accs[Math.floor(accs.length/2)], n:a.length};
}
function marcarPonto(rotuloPonto, aoFim){
  if(!pos){ alert('Sem posição de GPS ainda. Aguarde o sinal.'); return; }
  var bs = document.getElementById('btn-saida'), bc = document.getElementById('btn-chegada');
  bs.disabled = bc.disabled = true;
  amostras = [{lat:pos.lat, lng:pos.lng, acc:pos.acc}];
  var t0 = Date.now(), res = document.getElementById('res-tacada');
  amostrando = setInterval(function(){
    var rest = Math.max(0, Math.ceil((TEMPO_MEDIA_MS-(Date.now()-t0))/1000));
    res.textContent = 'Medindo '+rotuloPonto+'… fique parado ('+rest+' s)';
    if(Date.now()-t0 >= TEMPO_MEDIA_MS){
      clearInterval(amostrando); amostrando = null;
      var m = mediaPonderada(amostras); amostras = null;
      aoFim(m);
    }
  }, 500);
}
function desenhaTacada(){
  marcasT.forEach(function(x){ map.removeLayer(x); }); marcasT = [];
  if(linhaTacada){ map.removeLayer(linhaTacada); linhaTacada = null; }
  [saida, chegada].forEach(function(p, i){
    if(p) marcasT.push(L.circleMarker([p.lat,p.lng], {radius:6, color:'#fff', weight:2, fillColor:i?'#c62828':'#f9a825', fillOpacity:1}).addTo(map));
  });
  if(saida && chegada) linhaTacada = L.polyline([[saida.lat,saida.lng],[chegada.lat,chegada.lng]], {color:'#fff', weight:3, dashArray:'6 6'}).addTo(map);
}
document.getElementById('btn-saida').addEventListener('click', function(){
  chegada = null; document.getElementById('salvar-tacada').style.display = 'none';
  marcarPonto('saída', function(m){
    saida = m; desenhaTacada();
    document.getElementById('btn-saida').disabled = false;
    document.getElementById('btn-chegada').disabled = false;
    document.getElementById('res-tacada').textContent = 'Saída marcada ('+fmtPrec(m.acc)+'). Dê a tacada, vá até a bola e toque em “Marcar chegada”.';
  });
});
document.getElementById('btn-chegada').addEventListener('click', function(){
  marcarPonto('chegada', function(m){
    chegada = m; desenhaTacada();
    document.getElementById('btn-saida').disabled = false;
    document.getElementById('btn-chegada').disabled = false;
    var d = dist(saida, chegada), err = Math.hypot(saida.acc, chegada.acc);
    document.getElementById('res-tacada').innerHTML = '<span class="grande">'+fmt(d)+'</span> <span class="pequeno">(incerteza estimada ≈ '+fmtPrec(err)+')</span>' +
      (err > LIMITE_AVISO_M ? '<div class="aviso">Precisão baixa nesta medição; trate o valor como estimativa.</div>' : '');
    document.getElementById('salvar-tacada').style.display = '';
  });
});
document.getElementById('btn-salvar').addEventListener('click', function(){
  if(!saida || !chegada) return;
  hist.unshift({t:Date.now(), taco:document.getElementById('sel-taco').value, m:dist(saida,chegada), acc:Math.hypot(saida.acc,chegada.acc)});
  if(!gravar('hist', hist)) alert('Não foi possível gravar no armazenamento do navegador.');
  limpaTacada(); renderHist();
});
document.getElementById('btn-descartar').addEventListener('click', limpaTacada);
function limpaTacada(){
  saida = chegada = null; desenhaTacada();
  document.getElementById('salvar-tacada').style.display = 'none';
  document.getElementById('btn-chegada').disabled = true;
  document.getElementById('res-tacada').textContent = 'Fique ao lado da bola e toque em “Marcar saída”. Dê a tacada, caminhe até a bola e toque em “Marcar chegada”.';
}

// ---------- tacos / ajustes ----------
function renderTacos(){
  var s = document.getElementById('sel-taco'); s.innerHTML = '';
  cfg.tacos.forEach(function(t){ var o = document.createElement('option'); o.textContent = t; s.appendChild(o); });
  document.getElementById('cfg-tacos').value = cfg.tacos.join(', ');
  document.getElementById('cfg-unidade').value = cfg.unidade;
}
document.getElementById('cfg-salvar').addEventListener('click', function(){
  cfg.unidade = document.getElementById('cfg-unidade').value;
  var l = document.getElementById('cfg-tacos').value.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  if(l.length) cfg.tacos = l;
  gravar('cfg', cfg); renderTacos(); renderHist(); atualizaAlvo();
  document.getElementById('cfg-msg').textContent = 'Ajustes salvos.';
});

// ---------- histórico ----------
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function renderHist(){
  var med = {}, i;
  hist.forEach(function(h){ (med[h.taco] = med[h.taco] || []).push(h.m); });
  var tm = '<h3>Médias por taco</h3>';
  var ks = Object.keys(med);
  if(!ks.length) tm += '<p class="pequeno">Sem tacadas salvas.</p>';
  else {
    tm += '<table><tr><th>Taco</th><th>Qtd</th><th>Média</th><th>Maior</th></tr>';
    ks.forEach(function(k){
      var a = med[k], soma = a.reduce(function(x,y){ return x+y; }, 0);
      tm += '<tr><td>'+esc(k)+'</td><td>'+a.length+'</td><td>'+fmt(soma/a.length)+'</td><td>'+fmt(Math.max.apply(null,a))+'</td></tr>';
    });
    tm += '</table>';
  }
  document.getElementById('hist-medias').innerHTML = tm;
  var tl = '<table><tr><th>Data</th><th>Taco</th><th>Dist.</th></tr>';
  for(i=0;i<hist.length;i++){
    var h = hist[i];
    tl += '<tr><td>'+new Date(h.t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td><td>'+esc(h.taco)+'</td><td>'+fmt(h.m)+'</td></tr>';
  }
  document.getElementById('hist-lista').innerHTML = hist.length ? tl+'</table>' : '';
}
document.getElementById('limpar-hist').addEventListener('click', function(){
  if(confirm('Apagar todo o histórico de tacadas?')){ hist = []; gravar('hist', hist); renderHist(); }
});

// ---------- sobre ----------
document.getElementById('sobre').textContent =
NOME_APP + '\nVersão: ' + VERSAO + '\n' + COPYRIGHT + '. Todos os direitos reservados.\n\n' +
'MANUAL DE USO\n' +
'1) Permita o acesso à localização quando o navegador pedir. Use ao ar livre; o GPS do celular costuma errar de 3 a 5 m em céu aberto e mais perto de árvores e prédios.\n' +
'2) Aba Mapa > Alvo: toque no mapa para marcar frente, centro e fundo do green. A distância é atualizada conforme você anda.\n' +
'3) Aba Mapa > Tacada: fique ao lado da bola, toque em “Marcar saída” e aguarde alguns segundos parado. Dê a tacada, vá até a bola, toque em “Marcar chegada”, escolha o taco e salve.\n' +
'4) Histórico mostra médias por taco. Ajustes permite trocar jardas/metros e editar os tacos.\n' +
'5) A distância é em linha reta sobre o terreno (horizontal): não considera desnível, vento ou altitude. Ao lado de cada valor o app mostra a incerteza informada pelo GPS.\n' +
'6) Em competições, confira se a regra local permite aparelhos de medição de distância.\n\n' +
'TERMOS DE USO (MINUTA — revisar antes de distribuir)\n' +
'Este aplicativo é fornecido “no estado em que se encontra”, sem garantia de precisão ou de adequação a finalidade específica. As distâncias são estimativas obtidas por GPS e não substituem medição profissional nem servem como prova técnica. O usuário é responsável por seu uso, inclusive quanto às regras de competições e do campo.\n\n' +
'POLÍTICA DE PRIVACIDADE (MINUTA — revisar antes de distribuir)\n' +
'A localização é lida pelo navegador e processada somente no seu aparelho. O app não envia sua posição a servidor próprio. O histórico e os ajustes ficam no armazenamento local do navegador e podem ser apagados no próprio app. Ao exibir o mapa, o aparelho solicita imagens de satélite aos servidores do provedor do mapa (Esri), que podem registrar dados técnicos da requisição, como endereço IP e a região do mapa pedida. Dados de localização são dados pessoais (LGPD, Lei 13.709/2018). Contato do controlador: PENDENTE.\n\n' +
'CRÉDITOS E LICENÇAS\n' +
'• Leaflet 1.9.4 — © Vladimir Agafonkin e colaboradores, licença BSD-2-Clause (leafletjs.com).\n' +
'• Imagens de satélite: Esri World Imagery — Esri, Maxar, Earthstar Geographics e comunidade de usuários GIS. Sujeito aos termos de uso do provedor; confirmar a adequação ao uso pretendido (inclusive distribuição a terceiros) antes de publicar.\n' +
'• Código do aplicativo: ' + COPYRIGHT + '. Licença de distribuição: PENDENTE.\n';

// ---------- navegação ----------
document.querySelectorAll('nav button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('nav button').forEach(function(x){ x.classList.toggle('ativa', x===b); });
    document.querySelectorAll('.tela').forEach(function(t){ t.classList.toggle('ativa', t.id===b.dataset.tela); });
    if(b.dataset.tela==='tela-mapa') setTimeout(function(){ map.invalidateSize(); }, 50);
    if(b.dataset.tela==='tela-hist') renderHist();
  });
});

renderTacos(); renderHist();
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
})();
</script>
</body>
</html>
